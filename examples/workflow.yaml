# One run of the pipeline with the image CI last deployed.
#   kubectl create -f examples/workflow.yaml
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: streak-pipeline-
  namespace: argo
spec:
  workflowTemplateRef:
    name: streak-pipeline
  arguments:
    parameters:
    - name: n-frames
      value: "12"
    - name: seed
      value: "42"
